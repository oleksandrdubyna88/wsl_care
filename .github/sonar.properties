# SonarCloud analysis settings for wsl_care, read by .github/workflows/sonarcloud.yml (E4.S2) — mirroring the family
# credential-store repository's analysis (its `dotnet-sonarscanner begin` line), kept in a file so the settings are
# reviewable apart from the workflow.
#
# NOT NAMED sonar-project.properties AND NOT AT THE ROOT, on purpose and measured: the SonarScanner for .NET refuses
# the analysis when a sonar-project.properties sits in the folder `begin` runs in or in any project folder —
# SonarProjectPropertiesValidator.AreExistingSonarPropertiesFilesPresent, then ERR_ConflictingSonarProjectProperties
# ("sonar-project.properties files are not understood by the SonarScanner for .NET"), read in the scanner's source at
# tag 11.3.0.1175, the version the workflow pins. It also never READS such a file. So the workflow reads THIS one and
# passes every key to `begin`: sonar.projectKey as /k:, sonar.organization as /o:, everything else as /d:key=value.
# One `key=value` per line; `#` lines are comments; no value may contain a newline.
#
# The project must exist in SonarCloud under this key with Automatic Analysis switched OFF (a CI analysis is refused
# while it is on) — docs/repo-settings.md, step 6.
sonar.projectKey=remsoftdev_wsl_care
sonar.organization=remsoftdev
sonar.host.url=https://sonarcloud.io
# Coverage: dotnet-coverage over the three default test executables, one XML each.
sonar.cs.vscoveragexml.reportsPaths=coverage/*.xml
# Analysed: the product and its tests. Not analysed: build output, the publish folder, and research/ — the diagnostic
# scripts there are the record of a measurement, kept exactly as they produced the 2026-10-02 baselines.
sonar.exclusions=**/bin/**,**/obj/**,artifacts/**,research/**
# Excluded from COVERAGE only (still analysed for defects): the test projects themselves, and .github/scripts/ — the
# release scripts are tested by SPAWNING them (PackageFlows, ReleaseScriptFlows), which no coverage tool can see inside;
# measured in the family, a spawned script reports 0 % and fails the new-code gate for being "untested". The way back
# out: logic worth executing in-process moves into src_daemon/ and is covered normally.
sonar.coverage.exclusions=src_daemon/tests/**,.github/scripts/**,install.sh
