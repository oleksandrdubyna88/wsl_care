name: ci · extension

# The VS Code extension under src_vs_code/ (E5.S1, E5.S2): a clean typecheck, the linter, the whole test suite — unit,
# the strict fake's own tests, the client scenario flows over the golden contracts, the structural tests, the scan of the
# BUILT bundle, and the panel's page script RUN in the strict node:vm harness (npm test compiles, bundles with esbuild,
# then runs every compiled test file) — and the extension-host scenarios in a REAL VS Code, 1.85.0 and stable, through
# @vscode/test-electron (npm run test:host). Mirrors the family credential-store repository's `ci · extension`, without
# its path filter.
#
# UNCONDITIONAL rather than path-filtered (plan §15g m5, §15f #6). The client's tests replay contracts/golden/ (written
# by the daemon's scenario harness) and read src_daemon/src/WslCare.Cli/ExitCode.cs and research/module_tests.md, so a
# filter would have to name all of them and would still skip silently the day it missed one — and a required check a
# pull request can skip protects nothing. The repository is public; the runners are free.
#
# Shipped artefact -> what a pull request runs for it (.agents/conventions/common/platform-limits.md part 2):
#
#   - the extension's bundle (dist/extension.js, one universal .vsix, E5.S3) runs inside VS Code on Windows
#     (extensionKind ["ui"])                                               -> windows-latest
#   - the same bundle off Windows answers "Windows + WSL only" and starts nothing (E5.S2's notice: the extension-host
#     scenarios assert it in a real VS Code on Linux, under xvfb)          -> ubuntu-24.04
#
# Both legs run ALL of it; the client's platform is injected in its tests, so every flow runs on Linux too, and the
# strict fake is a Node script started through the product's own runner seam on either. No test can reach a real
# wsl.exe: every test process carries a tripwire that throws on any start of `wsl` / `wsl.exe`, and a test asserts it
# is armed; in the extension host the runner is the strict fake or the CLOSED one, never the real one (Test mode).
#
# PACKAGING ON EVERY PULL REQUEST, on both legs (E5.S3, plan §15g M8): `vsce package` builds the universal .vsix exactly
# as release-extension.yml does, and scripts/check-vsix.mjs checks the ARTEFACT — `vsce ls --no-dependencies` equal to
# vsix-files.txt, and inside the unzipped .vsix: exactly the allowlist, no drive / home / mnt / wsl-share path, no user
# name of the runner (derived when the check runs) or word of vsix-denylist.txt, no e-mail address, no source map, a
# build stamp equal to the package version. The release adds only `--release` (the placeholder publisher refused), so a
# leak is found on the pull request that introduced it, not on a release day.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    name: extension · typecheck · lint · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: src_vs_code
    steps:
      # This job builds and RUNS code from a pull request, so the checkout must not leave the token behind in the local
      # git config where that code could reach it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22 runs the tests; the bundle targets node18, the Node of VS Code 1.85 (engines.vscode ^1.85.0).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src_vs_code/package-lock.json

      - name: Install (the lock file, exactly)
        run: npm ci

      # A clean tsc FIRST and read on its own (TypeScript doctrine §4): tsc emits despite errors unless noEmitOnError is
      # set, and a suite run against a stale out/ is numbers about code that did not build.
      - name: Typecheck
        run: npm run typecheck

      # complexity 4, max-lines-per-function 50, max-lines 800 on src/; no-floating-promises; LF line endings.
      - name: Lint
        run: npm run lint

      # compile (into out/, noEmitOnError) -> bundle (dist/extension.js) -> every compiled *.test.js, found by walking
      # out/test: unit, fake, scenario flows, structure (one runner, one argv builder, one verb module), the bundle
      # scan (no -u / root / --timer / --confirm / --manual / config word ships, each with a planted companion) and
      # the scriptInterpolation scan.
      - name: Test (compile, bundle, run)
        run: npm test

      # vsce package runs vscode:prepublish (the bundle, stamped with package.json's version) and writes
      # ai-os-care-<version>.vsix (<name>-<version> of package.json) — the universal package, the one file the leak checks then open.
      - name: Package the .vsix (vsce package)
        run: npm run package

      - name: Leak checks on the .vsix (allowlist, paths, names, e-mail, source maps, build stamp)
        run: npm run check:vsix

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-vsix-${{ matrix.os }}
          path: src_vs_code/ai-os-care-*.vsix
          if-no-files-found: error
          retention-days: 14

      # The VS Code builds @vscode/test-electron downloads (1.85.0, ~125 MB, and the current stable, ~340 MB), cached
      # per OS and per month: 1.85.0 never changes, and a new stable is fetched once and then cached until the month
      # turns (test-electron asks the update service which build "stable" is on every run).
      - name: Month stamp for the VS Code download cache
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache the VS Code builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src_vs_code/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: vscode-test-${{ runner.os }}-

      # The extension-host scenarios (src/test/host/suite.ts) in VS Code 1.85.0 (the engines floor) AND stable, two
      # launches each: Test mode with the strict fake (activates, the status-bar item shows the daemon's answer, the
      # webview renders every field-map row, no -d call while the distribution is stopped or the window unfocused,
      # "Start WSL and check" makes exactly one) and Test mode WITHOUT the fake (nothing is started at all). On Linux the
      # same launches assert the "Windows + WSL only" notice and that nothing reaches the runner.
      - name: Extension-host scenarios (Windows; 1.85.0 + stable)
        if: runner.os == 'Windows'
        run: npm run test:host

      # A headless runner has no display and VS Code is a desktop application: without xvfb the editor never starts.
      - name: Extension-host scenarios (Linux, under xvfb; 1.85.0 + stable)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host
