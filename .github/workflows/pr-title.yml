name: pr · title

# The pull request title becomes the line in main's history (rebase keeps commits, squash uses the
# title), so it has to say what changed in the family's own shape: `type: what changed`. The subject
# is free text: proper nouns (SonarCloud, CodeRabbit, Dependabot) start with capitals, and a check
# that rejected them rejected the first real pull request it met.
#
# Mirrored verbatim from the family's credential-store repository. That copy reads no repository
# file — it checks the title alone, through the action's API call — so nothing had to be stripped
# for this repository; no step here depends on a file wsl_care does not have yet.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic:
    name: pr · semantic title
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            chore
            refactor
            perf
            ci
            build
          requireScope: false
